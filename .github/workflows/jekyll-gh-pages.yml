name: deploy-book

on:
  push:
    branches: [ main ]   # <-- cámbialo si tu rama principal no es main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # si tienes requirements.txt, déjalo primero:
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install jupyter-book  # JB 2.x

      - name: Build the book
        run: jupyter-book build .

      - name: Upload built book as artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_build/html   # carpeta html que genera jupyter-book

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
